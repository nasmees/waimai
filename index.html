<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#2a1150" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />

  <title>ไหวไหม — วิเคราะห์สินเชื่อก่อนกู้</title>
  <meta name="application-name" content="ไหวไหม" />
  <meta name="apple-mobile-web-app-title" content="ไหวไหม" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #5b2d9e;
      --primary-deep: #2a1150;
      --primary-glow: rgba(91,45,158,.45);
      --gold: #d4a017;
      --safe: #0d9b6a;
      --caution: #d97706;
      --risk: #dc2626;
      --fg: #1a1228;
      --muted: #5c5470;
      --glass: rgba(255,255,255,.55);
      --glass-strong: rgba(255,255,255,.72);
      --glass-border: rgba(255,255,255,.55);
      --glass-edge: rgba(255,255,255,.85);
      --blur: 22px;
      --radius: 22px;
      --radius-sm: 14px;
      --nav-h: 72px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --shadow-glass: 0 8px 32px rgba(42,17,80,.12), inset 0 1px 0 rgba(255,255,255,.6);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { height: 100%; }
    body {
      font-family: Sarabun, system-ui, sans-serif;
      color: var(--fg);
      line-height: 1.5;
      min-height: 100%;
      min-height: 100dvh;
      padding-bottom: calc(var(--nav-h) + var(--safe-bottom) + 28px);
      overscroll-behavior-y: contain;
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(91,45,158,.35), transparent 55%),
        radial-gradient(900px 500px at 100% 20%, rgba(13,155,106,.22), transparent 50%),
        radial-gradient(700px 400px at 50% 100%, rgba(212,160,23,.18), transparent 45%),
        linear-gradient(165deg, #e8e0f4 0%, #dfe8f5 40%, #e6f0ea 100%);
      background-attachment: fixed;
    }
    button, [role="button"] { cursor: pointer; font-family: inherit; }
    input, select, textarea { font-family: inherit; font-size: 16px; }

    /* Liquid glass surface */
    .glass {
      background: var(--glass);
      backdrop-filter: blur(var(--blur)) saturate(160%);
      -webkit-backdrop-filter: blur(var(--blur)) saturate(160%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow-glass);
      border-radius: var(--radius);
    }
    .glass-strong {
      background: var(--glass-strong);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid var(--glass-edge);
      box-shadow: 0 12px 40px rgba(42,17,80,.14), inset 0 1px 0 rgba(255,255,255,.75);
      border-radius: var(--radius);
    }

    .app-header {
      position: sticky; top: 0; z-index: 40;
      padding: 12px 16px 14px;
      background: rgba(42,17,80,.55);
      backdrop-filter: blur(24px) saturate(150%);
      -webkit-backdrop-filter: blur(24px) saturate(150%);
      border-bottom: 1px solid rgba(255,255,255,.18);
      color: #fff;
    }
    .app-header-inner {
      max-width: 520px; margin: 0 auto;
      display: flex; gap: 12px; align-items: center;
    }
    .app-header .app-icon {
      width: 46px; height: 46px; border-radius: 14px;
      object-fit: contain;
      box-shadow: 0 4px 16px rgba(0,0,0,.15);
      background: transparent;
    }
    .app-header img {
      width: 46px; height: 46px; border-radius: 14px;
      background: rgba(255,255,255,.92); object-fit: contain; padding: 3px;
      box-shadow: 0 4px 16px rgba(0,0,0,.15);
    }
    .app-header h1 { font-size: .98rem; font-weight: 700; line-height: 1.25; }
    .app-header p { font-size: .72rem; opacity: .88; margin-top: 2px; }

    .wrap { max-width: 520px; margin: 0 auto; padding: 16px 14px 8px; }

    .bottom-nav {
      position: fixed; left: 12px; right: 12px; bottom: calc(8px + var(--safe-bottom));
      height: var(--nav-h);
      display: flex; justify-content: space-around; align-items: stretch;
      z-index: 50;
      background: rgba(255,255,255,.65);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255,255,255,.7);
      border-radius: 24px;
      box-shadow: 0 10px 40px rgba(42,17,80,.15), inset 0 1px 0 rgba(255,255,255,.8);
      padding: 6px;
    }
    .nav-item {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 2px; border: 0; background: transparent; color: var(--muted);
      font-size: .7rem; font-weight: 600; border-radius: 18px; padding: 8px 2px;
      transition: background .2s, color .2s;
    }
    .nav-item.active {
      color: var(--primary-deep);
      background: rgba(255,255,255,.75);
      box-shadow: 0 2px 12px rgba(42,17,80,.08);
    }
    .nav-ico {
      font-size: .72rem; font-weight: 700; letter-spacing: -.02em;
      padding: 2px 6px;
    }

    .card {
      background: var(--glass);
      backdrop-filter: blur(var(--blur)) saturate(160%);
      -webkit-backdrop-filter: blur(var(--blur)) saturate(160%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow-glass);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
    }
    .card h3 { font-size: .95rem; color: var(--primary-deep); margin-bottom: 10px; font-weight: 700; }
    .section-title {
      font-size: .78rem; font-weight: 700; color: var(--muted);
      letter-spacing: .04em; margin: 18px 0 10px; text-transform: uppercase;
    }

    .hero {
      border-radius: var(--radius);
      padding: 20px 18px;
      margin-bottom: 14px;
      color: #fff;
      background: linear-gradient(135deg, rgba(91,45,158,.85), rgba(42,17,80,.9));
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,.25);
      box-shadow: 0 12px 36px rgba(42,17,80,.25), inset 0 1px 0 rgba(255,255,255,.3);
    }
    .hero.member {
      background: linear-gradient(135deg, rgba(13,155,106,.88), rgba(10,110,75,.92));
    }
    .hero.staff {
      background: linear-gradient(135deg, rgba(91,45,158,.85), rgba(42,17,80,.9));
    }
    .hero.learn {
      background: linear-gradient(135deg, rgba(212,160,23,.9), rgba(140,100,10,.92));
    }
    .hero h2 { font-size: 1.15rem; margin-bottom: 6px; }
    .hero p { font-size: .86rem; opacity: .93; }

    .role-grid, .tool-grid { display: grid; gap: 10px; }
    .role-card, .tool-card {
      background: var(--glass-strong);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border: 1px solid var(--glass-edge);
      border-radius: var(--radius);
      padding: 16px;
      text-align: left; width: 100%;
      box-shadow: var(--shadow-glass);
      transition: transform .15s, box-shadow .15s;
    }
    .role-card:active, .tool-card:active { transform: scale(.98); }
    .role-badge {
      display: inline-block; font-size: .68rem; font-weight: 700;
      padding: 4px 10px; border-radius: 99px; margin-bottom: 8px;
      background: rgba(255,255,255,.7); backdrop-filter: blur(8px);
    }
    .role-badge.member { color: var(--safe); }
    .role-badge.staff { color: var(--primary); }
    .role-card h3, .tool-card h3 { font-size: 1.02rem; margin: 0 0 6px; color: var(--fg); }
    .role-card p, .tool-card p { font-size: .82rem; color: var(--muted); margin: 0; line-height: 1.4; }
    .tool-card { display: flex; gap: 12px; align-items: center; padding: 14px; }
    .tool-mark {
      width: 46px; height: 46px; border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: .78rem; font-weight: 700; flex-shrink: 0;
      background: rgba(255,255,255,.65);
      border: 1px solid rgba(255,255,255,.8);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.9);
    }
    .tool-mark.dti { color: var(--primary); }
    .tool-mark.c7 { color: var(--safe); }
    .tool-mark.p3 { color: var(--caution); }
    .tool-mark.p5 { color: var(--risk); }
    .tool-mark.learn { color: #8a6800; }
    .tool-card .chev { margin-left: auto; color: var(--muted); font-size: 1.2rem; opacity: .4; }

    .fields { display: grid; gap: 12px; }
    .fields.two { grid-template-columns: 1fr 1fr; }
    @media (max-width: 400px) { .fields.two { grid-template-columns: 1fr; } }
    label { display: block; font-size: .82rem; font-weight: 600; margin-bottom: 5px; color: var(--fg); }
    .hint { font-size: .72rem; color: var(--muted); margin-top: 4px; line-height: 1.35; }
    .money { position: relative; }
    .money > span {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      color: var(--muted); font-size: .9rem; font-weight: 600; pointer-events: none;
    }
    input, select, textarea {
      width: 100%; height: 46px;
      border: 1px solid rgba(255,255,255,.7);
      border-radius: var(--radius-sm);
      padding: 0 12px;
      background: rgba(255,255,255,.55);
      backdrop-filter: blur(8px);
      color: var(--fg);
      box-shadow: inset 0 1px 2px rgba(42,17,80,.04);
    }
    .money input { padding-left: 28px; }
    textarea { height: auto; min-height: 80px; padding: 10px 12px; resize: vertical; }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: rgba(91,45,158,.5);
      background: rgba(255,255,255,.85);
      box-shadow: 0 0 0 3px rgba(91,45,158,.15);
    }

    .ok { color: var(--safe); font-weight: 700; }
    .bad { color: var(--risk); font-weight: 700; }
    ul.advice { padding-left: 18px; font-size: .88rem; }
    ul.advice li { margin: 7px 0; }
    .report {
      background: rgba(255,255,255,.4);
      border: 1px solid rgba(255,255,255,.5);
      border-radius: var(--radius-sm);
      padding: 14px; font-size: .88rem;
    }
    .report h3 { margin-bottom: 8px; font-size: .95rem; color: var(--primary-deep); }
    .report h4 { margin: 12px 0 5px; color: var(--primary); font-size: .88rem; }
    .report p { margin-bottom: 8px; }

    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; margin-bottom: 4px; }
    .btn {
      height: 48px; padding: 0 18px; border-radius: 16px; border: 0;
      font-weight: 700; font-size: .92rem; flex: 1; min-width: 130px;
      display: inline-flex; align-items: center; justify-content: center;
      transition: transform .12s, box-shadow .12s;
    }
    .btn:active { transform: scale(.97); }
    .btn-primary {
      background: linear-gradient(145deg, #6b3bb0, var(--primary-deep));
      color: #fff;
      box-shadow: 0 6px 20px rgba(42,17,80,.3), inset 0 1px 0 rgba(255,255,255,.25);
      border: 1px solid rgba(255,255,255,.2);
    }
    .btn-outline {
      background: rgba(255,255,255,.55);
      color: var(--primary-deep);
      border: 1px solid rgba(91,45,158,.35);
      backdrop-filter: blur(8px);
    }
    .btn-safe {
      background: linear-gradient(145deg, #12b07a, #0a7a55);
      color: #fff;
      box-shadow: 0 6px 20px rgba(13,155,106,.3);
      border: 1px solid rgba(255,255,255,.2);
    }

    .legend { font-size: .78rem; color: var(--muted); display: grid; gap: 6px; }
    .legend span { display: flex; gap: 8px; align-items: flex-start; }
    .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; margin-top: 4px; }
    .dot.g { background: var(--safe); } .dot.y { background: var(--caution); } .dot.r { background: var(--risk); }

    .learn-card {
      background: var(--glass);
      backdrop-filter: blur(var(--blur));
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      padding: 14px; margin-bottom: 10px;
      box-shadow: var(--shadow-glass);
    }
    .learn-card summary {
      font-weight: 700; font-size: .92rem; color: var(--primary-deep);
      cursor: pointer; list-style: none; display: flex; align-items: center;
    }
    .learn-card summary::-webkit-details-marker { display: none; }
    .learn-card summary::after { content: "+"; margin-left: auto; color: var(--muted); font-size: 1.1rem; }
    .learn-card[open] summary::after { content: "\2212"; }
    .learn-body { margin-top: 12px; font-size: .88rem; padding-top: 10px; border-top: 1px solid rgba(255,255,255,.4); }
    .learn-body p { margin-bottom: 8px; }
    .learn-body ul { padding-left: 18px; margin: 8px 0; }
    .learn-body li { margin: 4px 0; }
    .tip-box {
      background: rgba(245,233,200,.7);
      backdrop-filter: blur(8px);
      border-radius: var(--radius-sm);
      padding: 12px; margin-top: 10px; font-size: .85rem;
      border: 1px solid rgba(212,160,23,.3);
    }
    .tip-box strong { color: #8a6800; }

    .score-bar-row { margin: 10px 0; }
    .score-bar-row .top { display: flex; justify-content: space-between; font-size: .82rem; margin-bottom: 4px; }
    .score-bar { height: 8px; background: rgba(91,45,158,.12); border-radius: 99px; overflow: hidden; }
    .score-bar > i { display: block; height: 100%; background: linear-gradient(90deg, #6b3bb0, var(--primary-deep)); border-radius: 99px; }

    .back-link {
      display: inline-flex; align-items: center; gap: 4px; border: 0;
      background: rgba(255,255,255,.45); backdrop-filter: blur(8px);
      color: var(--primary-deep); font-weight: 600; font-size: .86rem;
      margin-bottom: 12px; padding: 8px 14px; border-radius: 99px;
      border: 1px solid rgba(255,255,255,.6);
    }

    .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .metric {
      background: rgba(255,255,255,.5);
      border: 1px solid rgba(255,255,255,.6);
      border-radius: var(--radius-sm);
      padding: 12px 10px; text-align: center;
    }
    .metric b { display: block; font-size: 1.08rem; color: var(--primary-deep); font-variant-numeric: tabular-nums; }
    .metric small { color: var(--muted); font-size: .7rem; }

    .banner {
      border-radius: var(--radius); padding: 20px 16px; color: #fff;
      margin-bottom: 12px; text-align: center;
      border: 1px solid rgba(255,255,255,.3);
      box-shadow: 0 8px 28px rgba(0,0,0,.12), inset 0 1px 0 rgba(255,255,255,.25);
    }
    .banner.excellent, .banner.good { background: linear-gradient(145deg, rgba(13,155,106,.92), rgba(10,110,75,.95)); }
    .banner.medium { background: linear-gradient(145deg, rgba(217,119,6,.92), rgba(180,83,9,.95)); }
    .banner.high, .banner.weak { background: linear-gradient(145deg, rgba(220,38,38,.92), rgba(153,27,27,.95)); }
    .banner.idle { background: linear-gradient(145deg, rgba(91,45,158,.9), rgba(42,17,80,.95)); }
    .banner .label { font-size: .85rem; opacity: .95; margin-bottom: 4px; }
    .banner .big { font-size: 2.5rem; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
    .banner .desc { font-size: .85rem; opacity: .92; margin-top: 6px; }
    .bar { height: 8px; background: rgba(255,255,255,.28); border-radius: 99px; overflow: hidden; margin-top: 12px; }
    .bar > i { display: block; height: 100%; background: #fff; width: 0; border-radius: 99px; transition: width .4s ease; }
    .status-pill {
      display: inline-block; padding: 4px 12px; border-radius: 99px;
      font-size: .78rem; font-weight: 700; margin-top: 8px; background: rgba(255,255,255,.25);
    }
    .chance-box {
      border-radius: var(--radius-sm); padding: 14px; margin-bottom: 10px;
      border: 1px solid rgba(255,255,255,.5); background: rgba(255,255,255,.4);
    }
    .chance-box.high { background: rgba(232,247,241,.75); border-color: rgba(13,155,106,.3); }
    .chance-box.mid { background: rgba(254,243,230,.75); border-color: rgba(217,119,6,.3); }
    .chance-box.low { background: rgba(253,236,234,.75); border-color: rgba(220,38,38,.3); }
    .chance-box h4 { font-size: .9rem; margin-bottom: 6px; }
    .chance-box.high h4 { color: var(--safe); }
    .chance-box.mid h4 { color: var(--caution); }
    .chance-box.low h4 { color: var(--risk); }
    .chance-box p { font-size: .85rem; margin: 0; }
    .step-list { counter-reset: step; list-style: none; padding: 0; }
    .step-list li {
      counter-increment: step; position: relative; padding-left: 36px;
      margin-bottom: 12px; font-size: .88rem;
    }
    .step-list li::before {
      content: counter(step); position: absolute; left: 0; top: 0;
      width: 24px; height: 24px; border-radius: 50%;
      background: linear-gradient(145deg, #6b3bb0, var(--primary-deep));
      color: #fff; font-size: .75rem; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 8px rgba(42,17,80,.25);
    }

    /* ===== Popup / Modal (liquid glass) ===== */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(26,12,48,.35);
      backdrop-filter: blur(10px) saturate(120%);
      -webkit-backdrop-filter: blur(10px) saturate(120%);
      display: flex; align-items: flex-end; justify-content: center;
      padding: 12px 12px calc(12px + var(--safe-bottom));
      opacity: 0; visibility: hidden; pointer-events: none;
      transition: opacity .25s ease, visibility .25s;
    }
    .modal-overlay.open {
      opacity: 1; visibility: visible; pointer-events: auto;
    }
    @media (min-width: 560px) {
      .modal-overlay { align-items: center; padding: 24px; }
    }
    .modal-sheet {
      width: 100%; max-width: 480px;
      max-height: min(88dvh, 720px);
      display: flex; flex-direction: column;
      background: rgba(255,255,255,.72);
      backdrop-filter: blur(32px) saturate(180%);
      -webkit-backdrop-filter: blur(32px) saturate(180%);
      border: 1px solid rgba(255,255,255,.8);
      border-radius: 28px 28px 22px 22px;
      box-shadow: 0 24px 64px rgba(42,17,80,.28), inset 0 1px 0 rgba(255,255,255,.9);
      transform: translateY(24px) scale(.98);
      transition: transform .28s cubic-bezier(.22,1,.36,1);
      overflow: hidden;
    }
    .modal-overlay.open .modal-sheet {
      transform: translateY(0) scale(1);
    }
    .modal-handle {
      width: 40px; height: 4px; border-radius: 99px;
      background: rgba(42,17,80,.18);
      margin: 10px auto 0;
      flex-shrink: 0;
    }
    .modal-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 18px 10px;
      border-bottom: 1px solid rgba(42,17,80,.08);
      flex-shrink: 0;
    }
    .modal-head h2 {
      font-size: 1.05rem; font-weight: 700; color: var(--primary-deep);
    }
    .modal-close {
      width: 36px; height: 36px; border-radius: 50%;
      border: 1px solid rgba(42,17,80,.12);
      background: rgba(255,255,255,.6);
      color: var(--muted); font-size: 1.2rem; font-weight: 500;
      display: flex; align-items: center; justify-content: center;
    }
    .modal-body {
      overflow-y: auto; padding: 14px 16px 20px;
      -webkit-overflow-scrolling: touch;
      flex: 1;
    }
    .modal-foot {
      padding: 10px 16px 14px;
      border-top: 1px solid rgba(42,17,80,.08);
      display: flex; gap: 8px;
      flex-shrink: 0;
      background: rgba(255,255,255,.4);
    }

    footer {
      text-align: center; font-size: .68rem; color: var(--muted);
      padding: 12px 16px 20px; max-width: 520px; margin: 0 auto;
    }

    @media print {
      .app-header, .bottom-nav, .back-link, .actions, .tool-card, .role-card,
      .modal-overlay, .btn { display: none !important; }
      body { padding: 0; background: #fff; }
      .wrap { max-width: 100%; }
      .modal-overlay.open { position: static; background: none; display: block; opacity: 1; visibility: visible; }
      .modal-sheet { max-height: none; box-shadow: none; border: 0; background: #fff; }
    }

    /* Icon scale */
    .ico {
      display: inline-flex; align-items: center; justify-content: center;
      width: 1.15em; height: 1.15em; flex-shrink: 0;
    }
    .ico svg { width: 100%; height: 100%; display: block; }
    /* Bottom nav — clear but not oversized */
    .nav-ico {
      width: 24px; height: 24px;
      display: flex; align-items: center; justify-content: center;
      color: var(--muted);
      margin-bottom: 3px;
    }
    .nav-ico svg { width: 24px; height: 24px; display: block; }
    .nav-item.active .nav-ico { color: var(--primary-deep); }
    .nav-item .ico { width: 24px; height: 24px; margin-bottom: 3px; color: var(--muted); }
    .nav-item.active .ico { color: var(--primary-deep); }
    /* Tool cards */
    .tool-mark .ico { width: 22px; height: 22px; }
    .tool-mark { color: inherit; }
    .role-card .ico-wrap {
      width: 48px; height: 48px; border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,.65);
      border: 1px solid rgba(255,255,255,.8);
      margin-bottom: 10px;
    }
    .role-card .ico-wrap .ico { width: 24px; height: 24px; }

function calcDti(d) {
  const income = n(d.salary)+n(d.allowance)+n(d.overtime)+n(d.otherIncome);
  const cc = n(d.creditCardBalance)*0.1, rev = n(d.revolvingBalance)*0.05;
  const existing = n(d.housing)+n(d.vehicle)+n(d.coopExisting)+n(d.otherLoan)+cc+rev+n(d.loanFee)+n(d.memberOther);
  const total = existing + n(d.newInstallment);
  const dti = income > 0 ? (total/income)*100 : 0;
  const remaining = income - total;
  const remainingPct = income > 0 ? (remaining/income)*100 : 0;
  const remainingOk = remainingPct >= 30;
  let status = "high";
  if (dti < 36) status = "excellent"; else if (dti < 50) status = "medium";
  const head = ratio => Math.max(0, income*ratio - existing);
  return { income, existing, total, dti, remaining, remainingPct, remainingOk, status,
    extra36: head(0.36), extra50: head(0.50), extra70: head(0.70) };
}

function calcSelf(d) {
  const income = n(d.salary)+n(d.otherIncome);
  const cc = n(d.creditCard)*0.1;
  const existing = n(d.housing)+n(d.vehicle)+n(d.otherDebt)+cc;
  const months = Math.max(1, n(d.wantMonths)||36);
  const newInst = n(d.wantLoan)>0 ? n(d.wantLoan)/months : 0;
  const total = existing + newInst;
  const dti = income>0 ? (total/income)*100 : 0;
  const remaining = income - total;
  const remainingPct = income>0 ? (remaining/income)*100 : 0;
  const remainingOk = remainingPct >= 30;
  let dtiStatus = "high";
  if (dti < 36) dtiStatus = "excellent"; else if (dti < 50) dtiStatus = "medium";
  const quality = avg([n(d.jobStable),n(d.payHistory),n(d.hasSavings),n(d.hasGuarantor),n(d.purposeClear)]);
  const qualityScore = (quality/5)*100;
  let dtiPts = 5;
  if (dti < 36 && remainingOk) dtiPts = 45;
  else if (dti < 50 && remainingOk) dtiPts = 30;
  else if (dti < 50) dtiPts = 18;
  else if (remainingOk) dtiPts = 12;
  const readiness = Math.round(dtiPts + (qualityScore/100)*55);
  let chance="low", chanceLabel="โอกาสได้รับสินเชื่อค่อนข้างต่ำ", chanceClass="low";
  if (readiness >= 75) { chance="high"; chanceLabel="โอกาสได้รับสินเชื่อค่อนข้างสูง"; chanceClass="high"; }
  else if (readiness >= 55) { chance="mid"; chanceLabel="โอกาสได้รับสินเชื่อปานกลาง"; chanceClass="mid"; }
  let statusKey="high", statusTitle="ยังไม่พร้อมขอสินเชื่อ";

  const head = ratio => Math.max(0, income*ratio - existing);
  return {
    income, existing, newInst, total, dti, remaining, remainingPct, remainingOk, dtiStatus,
    quality, qualityScore, readiness, chance, chanceLabel, chanceClass, statusKey, statusTitle,
    months, maxLoan36: head(0.36)*months, maxLoan50: head(0.50)*months, maxLoan30: head(0.70)*months,
    wantLoan: n(d.wantLoan)
  };
}

const AFFORD_EMPTY = {
  salary:0, otherIncome:0, housing:0, vehicle:0, otherDebt:0, creditCard:0, months:36
};
const DEBTPLAN_EMPTY = {
  salary:0, otherIncome:0, totalDebtPay:0, targetDti:40, extraPay:2000
};
const COMPARE_EMPTY = {
  salary:0, otherIncome:0, existingDebt:0,
  amountA:100000, monthsA:36,
  amountB:80000, monthsB:36,
  amountC:100000, monthsC:48
};
const COST_EMPTY = {
  principal:100000, months:36, profitRate:6, method:"flat"
};
const QUIZ_EMPTY = { answers:{} };

function incomeOf(d) {
  return n(d.salary) + n(d.otherIncome);
}
function existingDebtOf(d) {
  return n(d.housing) + n(d.vehicle) + n(d.otherDebt) + n(d.creditCard) * 0.1;
}

function calcAfford(d) {
  const income = incomeOf(d);
  const existing = existingDebtOf(d);
  const months = Math.max(1, n(d.months) || 36);
  const head = ratio => Math.max(0, income * ratio - existing);
  const maxInst36 = head(0.36);
  const maxInst50 = head(0.50);
  const maxInst30 = head(0.70); // remaining 30%
  return {
    income, existing, months,
    maxInst36, maxInst50, maxInst30,
    maxLoan36: maxInst36 * months,
    maxLoan50: maxInst50 * months,
    maxLoan30: maxInst30 * months,
    dtiNow: income > 0 ? (existing / income) * 100 : 0,
    remainNow: income - existing,
    remainPct: income > 0 ? ((income - existing) / income) * 100 : 0
  };
}

function calcDebtPlan(d) {
  const income = incomeOf(d);
  const pay = n(d.totalDebtPay);
  const target = Math.min(80, Math.max(10, n(d.targetDti) || 40));
  const extra = Math.max(0, n(d.extraPay));
  const dtiNow = income > 0 ? (pay / income) * 100 : 0;
  const targetPay = income * (target / 100);
  const needReduce = Math.max(0, pay - targetPay);
  // months to reach if paying extra on top of current (approx linear on installment reduction)
  let monthsToTarget = null;
  if (needReduce <= 0) monthsToTarget = 0;
  else if (extra > 0) monthsToTarget = Math.ceil(needReduce / extra);
  const remainPct = income > 0 ? ((income - pay) / income) * 100 : 0;
  return {
    income, pay, target, extra, dtiNow, targetPay, needReduce, monthsToTarget, remainPct,
    ok: dtiNow <= target
  };
}

function calcCompare(d) {
  const income = incomeOf(d);
  const existing = n(d.existingDebt);
  const opts = [
    { key: "A", label: "ทางเลือก A (ตามที่คิดกู้)", amount: n(d.amountA), months: Math.max(1, n(d.monthsA) || 36) },
    { key: "B", label: "ทางเลือก B (ลดวงเงิน)", amount: n(d.amountB), months: Math.max(1, n(d.monthsB) || 36) },
    { key: "C", label: "ทางเลือก C (ขยายงวด)", amount: n(d.amountC), months: Math.max(1, n(d.monthsC) || 48) },
  ].map(o => {
    const inst = o.amount / o.months;
    const totalPay = existing + inst;
    const dti = income > 0 ? (totalPay / income) * 100 : 0;
    const remain = income - totalPay;
    const remainPct = income > 0 ? (remain / income) * 100 : 0;
    let status = "high";
    if (dti < 36 && remainPct >= 30) status = "excellent";
    else if (dti < 50 && remainPct >= 30) status = "medium";
    else if (dti < 50) status = "medium";
    return { ...o, inst, totalPay, dti, remain, remainPct, status };
  });
  return { income, existing, opts };
}

/** Islamic cooperative cost estimate — profit rate, not riba interest */
function calcIslamicCost(d) {
  const principal = Math.max(0, n(d.principal));
  const months = Math.max(1, n(d.months) || 36);
  const rate = Math.max(0, n(d.profitRate)); // % per year
  const years = months / 12;
  let totalProfit = 0, totalPay = 0, monthly = 0, method = d.method || "flat";
  if (method === "flat") {
    // กำไรคงที่ตลอดสัญญา (นิยมใช้ประมาณการมูราบะฮะแบบง่าย)
    totalProfit = principal * (rate / 100) * years;
    totalPay = principal + totalProfit;
    monthly = totalPay / months;
  } else {
    // ลดต้นแบบคร่าว ๆ (เฉลี่ยยอดต้น)
    totalProfit = principal * (rate / 100) * years * 0.55;
    totalPay = principal + totalProfit;
    monthly = totalPay / months;
  }
  return {
    principal, months, rate, years, method, totalProfit, totalPay, monthly,
    costPerTenThousand: principal > 0 ? (totalProfit / principal) * 10000 : 0
  };
}

function calcQuiz(d) {
  const answers = d.answers || {};
  let score = 0, total = QUIZ_QUESTIONS.length;
  const detail = QUIZ_QUESTIONS.map(q => {
    const picked = answers[q.id];
    const correct = Number(picked) === q.ans;
    if (correct) score++;
    return { ...q, picked, correct };
  });
  const pct = Math.round((score / total) * 100);
  let level = "ควรทบทวน";
  if (pct >= 85) level = "ดีเยี่ยม";
  else if (pct >= 70) level = "ดี";
  else if (pct >= 50) level = "ปานกลาง";
  return { score, total, pct, level, detail };
}

  const tone = r.status==="excellent"?"ความสามารถชำระอยู่ในเกณฑ์ดีเยี่ยม":r.status==="medium"?"ความสามารถชำระพอใช้ ต้องควบคุมภาระใหม่":"ความสามารถชำระตึงตัว มีความเสี่ยง";
  return `<h3>รายงานวิเคราะห์ DTI</h3>
    <p>รายได้ ${baht(r.income)} บาท/เดือน · หนี้ ${baht(r.total)} บาท/เดือน · DTI ${r.dti.toFixed(1)}% · ${dtiCopy(r.status).title}</p>
    <h4>การประเมิน</h4>
    <p>${tone} เงินเหลือ ${baht(r.remaining)} บาท (${r.remainingPct.toFixed(1)}%) ${r.remainingOk?"ผ่านเกณฑ์ ≥ 30%":"ต่ำกว่าเกณฑ์ 30%"}</p>
    <h4>กรอบวงเงินแนะนำ</h4>
    <p>DTI &lt; 36% ≈ ${baht(r.extra36)} บาท/เดือน · DTI &lt; 50% ≈ ${baht(r.extra50)} · เงินเหลือ 30% ≈ ${baht(r.extra70)}</p>`;
}
function dtiResultHtml(r, ready, cp) {
  const cls = ready ? r.status : "idle";
  const suggestions = [];
  if (!ready) suggestions.push("กรอกรายได้ก่อนหักภาษีเพื่อคำนวณ");
  else {
    if (r.status==="excellent") suggestions.push("DTI ดีเยี่ยม โอกาสอนุมัติสูงขึ้นหากผ่านเงื่อนไขอื่น");
    if (r.status==="medium") suggestions.push("DTI ระดับกลาง ควรหลีกเลี่ยงการเพิ่มหนี้");
    if (r.status==="high") suggestions.push("DTI สูง อาจถูกปฏิเสธ ควรรอลดหนี้ก่อน");
    if (!r.remainingOk) suggestions.push("ไม่ผ่านเงื่อนไขเงินเหลือใช้จ่ายอย่างน้อย 30%");
    else suggestions.push("ผ่านเงื่อนไขเงินเหลือใช้จ่ายหลังหักหนี้");
  }
  const loanTips = buildLoanAdvice(ready?r:null, null);
  return `<div class="banner ${cls}">
      <div class="label">${ready?cp.title:"ยังไม่มีผล"}</div>
      <div class="big">${ready?r.dti.toFixed(1)+"%":"—"}</div>
      <div class="desc">${ready?cp.desc:"กรอกข้อมูลแล้วกดดูผล"}</div>
      <div class="bar"><i style="width:${ready?Math.min(r.dti,100):0}%"></i></div>
    </div>
    <div class="metrics">
      <div class="metric"><small>รายได้รวม</small><b>${baht(r.income)}</b><small>บาท/เดือน</small></div>
      <div class="metric"><small>หนี้รวม</small><b>${baht(r.total)}</b><small>บาท/เดือน</small></div>
      <div class="metric"><small>เงินเหลือใช้จ่าย</small><b>${baht(r.remaining)}</b><small>${r.remainingPct.toFixed(1)}%</small></div>
      <div class="metric"><small>งวดใหม่สูงสุด</small><b>${baht(r.extra70)}</b><small>บาท/เดือน</small></div>
    </div>
    <div class="card" style="margin:0 0 12px;box-shadow:none"><h3>เงื่อนไขเงินเหลือ</h3>
      <p class="${ready&&r.remainingOk?"ok":"bad"}">${ready?(r.remainingOk?"ผ่านเกณฑ์อย่างน้อย 30%":"ไม่ผ่านเกณฑ์"):"รอข้อมูล"}</p></div>
    <div class="card" style="margin:0 0 12px;box-shadow:none"><h3>คำแนะนำ</h3><ul class="advice">${suggestions.map(s=>`<li>${s}</li>`).join("")}</ul></div>
    <div class="card" style="margin:0 0 12px;box-shadow:none"><h3>แนะนำการขอสินเชื่อ</h3><ul class="advice">${loanTips.map(s=>`<li>${s}</li>`).join("")}</ul></div>
    <div class="card" style="margin:0 0 12px;box-shadow:none"><h3>เกณฑ์ DTI</h3><div class="legend">
      <span><i class="dot g"></i> ต่ำกว่า 36% — ดีเยี่ยม</span>
      <span><i class="dot y"></i> 36–49% — กลาง</span>
      <span><i class="dot r"></i> 50% ขึ้นไป — สูง</span>
    </div></div>
    <div class="report">${dtiReport(r,ready)}</div>`;
}

function scorePanelBody(name, score, grade, entries, reportHtml) {
  const suggestions = [
    `ภาพรวม ${name} ได้ ${score.toFixed(1)} จาก 100 ระดับ${grade.label}`, grade.advice,
    ...entries.filter(([,v])=>v<3).map(([k])=>`จุดอ่อน: ${k}`),
    ...entries.filter(([,v])=>v>=4).slice(0,2).map(([k])=>`จุดแข็ง: ${k}`),
  ];
  const dtiSnap = calcDti(store.dti);
  const loanTips = buildLoanAdvice(dtiSnap.income>0?dtiSnap:null, { score });
  return `<div class="banner ${grade.key}">
      <div class="label">คะแนนรวม ${name}</div><div class="big">${score.toFixed(1)}</div>
      <div class="desc">ระดับ${grade.label} · เต็ม 100</div>
      <div class="bar"><i style="width:${score}%"></i></div></div>
    <div class="card" style="margin:0 0 12px;box-shadow:none"><h3>คะแนนรายด้าน</h3>${bars(entries)}</div>
    <div class="card" style="margin:0 0 12px;box-shadow:none"><h3>คำแนะนำ</h3><ul class="advice">${suggestions.map(x=>`<li>${x}</li>`).join("")}</ul></div>
    <div class="card" style="margin:0 0 12px;box-shadow:none"><h3>แนะนำการขอสินเชื่อ</h3><ul class="advice">${loanTips.map(x=>`<li>${x}</li>`).join("")}</ul></div>
    <div class="report">${reportHtml}</div>`;
}
function c7Report(r,s) {
  const weak = Object.entries(r.C).filter(([,v])=>v<3).map(([k])=>k);

}

      </div>`).join("")}
    <div class="report"><h3>คำแนะนำต่อ</h3>
      <p>${r.pct>=70?"พื้นฐานดี ลองใช้เครื่องมือประเมินก่อนยื่นกู้และวงเงินที่ไหวต่อ":"แนะนำอ่านส่วนความรู้ทางการเงิน แล้วทำแบบทดสอบอีกครั้ง"}</p>
    </div>`;
}
const store = {
  view: "home",
  dti: load("fatoni-dti-v3", DTI_EMPTY),
  c7: load("fatoni-c7", C7_EMPTY),
  p3: load("fatoni-p3", P3_EMPTY),
  p5: load("fatoni-p5", P5_EMPTY),
  self: load("fatoni-self-v1", SELF_EMPTY),
  afford: load("fatoni-afford-v1", AFFORD_EMPTY),
  debtplan: load("fatoni-debtplan-v1", DEBTPLAN_EMPTY),
  compare: load("fatoni-compare-v1", COMPARE_EMPTY),
  cost: load("fatoni-cost-v1", COST_EMPTY),
  quiz: load("fatoni-quiz-v1", QUIZ_EMPTY),
};
const SUB_TITLES = {
  home: "วิเคราะห์สินเชื่อก่อนกู้",
  self: "ประเมินก่อนยื่นกู้",
  member: "เครื่องมือ · ทั่วไป",
  afford: "วงเงิน / งวดที่ไหว",
  debtplan: "วางแผนลดหนี้",
  compare: "เปรียบเทียบทางเลือก",
  cost: "ประมาณต้นทุน / กำไร",
  quiz: "แบบทดสอบความรู้",
  staff: "เครื่องมือ · สถาบัน",
  dti: "คำนวณ DTI", c7: "วิเคราะห์ 7C", p3: "วิเคราะห์ 3P", p5: "วิเคราะห์ 5P",
  learn: "ความรู้ทางการเงิน",
};

function openResultModal(title, html) {
  document.getElementById("modalTitle").textContent = title;
  document.getElementById("modalBody").innerHTML = html;
  document.getElementById("resultModal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeResultModal() {
  document.getElementById("resultModal").classList.remove("open");
  document.body.style.overflow = "";
}
function showAnalysis(kind) {
  if (kind === "self") {
    const r = calcSelf(store.self);
    const adv = selfAdvice(r, store.self);
    openResultModal("ผลการประเมิน", selfResultHtml(r, r.income > 0, adv, store.self));
  } else if (kind === "afford") {
    openResultModal("วงเงิน / งวดที่ไหว", affordResultHtml(calcAfford(store.afford)));
  } else if (kind === "debtplan") {
    openResultModal("แผนลดหนี้ / เป้า DTI", debtplanResultHtml(calcDebtPlan(store.debtplan)));
  } else if (kind === "compare") {
    openResultModal("เปรียบเทียบทางเลือก", compareResultHtml(calcCompare(store.compare)));
  } else if (kind === "cost") {
    openResultModal("ประมาณต้นทุน / อัตรากำไร", costResultHtml(calcIslamicCost(store.cost)));
  } else if (kind === "quiz") {
    openResultModal("ผลแบบทดสอบความรู้", quizResultHtml(calcQuiz(store.quiz)));
  } else if (kind === "dti") {
    const r = calcDti(store.dti);
    openResultModal("ผลการคำนวณ DTI", dtiResultHtml(r, r.income > 0, dtiCopy(r.status)));
  } else if (kind === "c7") {
    const r = calc7C(store.c7);
    openResultModal("ผลการวิเคราะห์ 7C", scorePanelBody("7C", r.score, r.grade, Object.entries(r.C), c7Report(r, store.c7)));
  } else if (kind === "p3") {
    const r = calc3P(store.p3);
    openResultModal("ผลการวิเคราะห์ 3P", scorePanelBody("3P", r.score, r.grade, Object.entries(r.P), p3Report(r, store.p3)));
  } else if (kind === "p5") {
    const r = calc5P(store.p5);
    openResultModal("ผลการวิเคราะห์ 5P", scorePanelBody("5P", r.score, r.grade, Object.entries(r.P), p5Report(r, store.p5)));
  }
}


function hydrateIcons(root) {
  (root || document).querySelectorAll("[data-ico]").forEach(el => {
    const name = el.getAttribute("data-ico");
    if (name && I[name]) el.innerHTML = I[name];
  });
}

function setNavActive(view) {
  document.querySelectorAll(".nav-item").forEach(btn => {
    const nav = btn.getAttribute("data-nav");
    let active = nav === view;
    if (["dti","c7","p3","p5"].includes(view)) active = nav === "staff";
    if (["member","self","afford","debtplan","compare","cost","quiz"].includes(view)) active = nav === "self";
    btn.classList.toggle("active", active);
  });
  const sub = document.getElementById("headerSub");
  if (sub) sub.textContent = SUB_TITLES[view] || SUB_TITLES.home;
}
function render() {
  closeResultModal();
  const app = document.getElementById("app");
  setNavActive(store.view);
  const v = store.view;
  if (v === "home") app.innerHTML = homeView();
  else if (v === "member") app.innerHTML = memberHubView();
  else if (v === "self") app.innerHTML = selfView(store.self);
  else if (v === "afford") app.innerHTML = affordView(store.afford);
  else if (v === "debtplan") app.innerHTML = debtplanView(store.debtplan);
  else if (v === "compare") app.innerHTML = compareView(store.compare);
  else if (v === "cost") app.innerHTML = costView(store.cost);
  else if (v === "quiz") app.innerHTML = quizView(store.quiz);
  else if (v === "staff") app.innerHTML = staffHubView();
  else if (v === "dti") app.innerHTML = dtiView(store.dti);
  else if (v === "c7") app.innerHTML = c7View(store.c7);
  else if (v === "p3") app.innerHTML = p3View(store.p3);
  else if (v === "p5") app.innerHTML = p5View(store.p5);
  else if (v === "learn") app.innerHTML = learnView();
  bind();
  hydrateIcons(document);
  window.scrollTo(0, 0);
}
function currentKey() {
  return { dti:"dti", c7:"c7", p3:"p3", p5:"p5", self:"self", afford:"afford", debtplan:"debtplan", compare:"compare", cost:"cost", quiz:"quiz" }[store.view] || null;
}
function bind() {
  document.querySelectorAll("[data-go]").forEach(btn => {
    btn.onclick = () => { store.view = btn.getAttribute("data-go"); render(); };
  });
  document.querySelectorAll("[data-show]").forEach(btn => {
    btn.onclick = () => showAnalysis(btn.getAttribute("data-show"));
  });
  document.querySelectorAll("[data-k]").forEach(el => {
    const handler = () => {
      const key = currentKey();
      if (!key) return;
      const k = el.getAttribute("data-k");
      if (el.tagName === "TEXTAREA") store[key][k] = el.value;
      else if (el.tagName === "SELECT" && el.getAttribute("data-k") === "method") store[key][k] = el.value;
      else store[key][k] = n(el.value);
      if (key === "dti") save("fatoni-dti-v3", store.dti);
      else if (key === "self") save("fatoni-self-v1", store.self);
      else if (key === "afford") save("fatoni-afford-v1", store.afford);
      else if (key === "debtplan") save("fatoni-debtplan-v1", store.debtplan);
      else if (key === "compare") save("fatoni-compare-v1", store.compare);
      else if (key === "cost") save("fatoni-cost-v1", store.cost);
      else if (key === "quiz") save("fatoni-quiz-v1", store.quiz);
      else save("fatoni-" + key, store[key]);
    };
    el.addEventListener(el.tagName === "SELECT" ? "change" : "input", handler);
  });
  
  document.querySelectorAll("[data-quiz]").forEach(el => {
    el.addEventListener("change", () => {
      if (!store.quiz.answers) store.quiz.answers = {};
      store.quiz.answers[el.getAttribute("data-quiz")] = n(el.value);
      save("fatoni-quiz-v1", store.quiz);
    });
  });

  document.querySelectorAll("[data-reset]").forEach(btn => {
    btn.onclick = () => {
      const t = btn.getAttribute("data-reset");
      if (t === "dti") { store.dti = { ...DTI_EMPTY }; save("fatoni-dti-v3", store.dti); }
      if (t === "c7") { store.c7 = { ...C7_EMPTY }; save("fatoni-c7", store.c7); }
      if (t === "p3") { store.p3 = { ...P3_EMPTY }; save("fatoni-p3", store.p3); }
      if (t === "p5") { store.p5 = { ...P5_EMPTY }; save("fatoni-p5", store.p5); }
      if (t === "self") { store.self = { ...SELF_EMPTY }; save("fatoni-self-v1", store.self); }
      if (t === "afford") { store.afford = { ...AFFORD_EMPTY }; save("fatoni-afford-v1", store.afford); }
      if (t === "debtplan") { store.debtplan = { ...DEBTPLAN_EMPTY }; save("fatoni-debtplan-v1", store.debtplan); }
      if (t === "compare") { store.compare = { ...COMPARE_EMPTY }; save("fatoni-compare-v1", store.compare); }
      if (t === "cost") { store.cost = { ...COST_EMPTY }; save("fatoni-cost-v1", store.cost); }
      if (t === "quiz") { store.quiz = { answers:{} }; save("fatoni-quiz-v1", store.quiz); }
      render();
    };
  });
}
document.getElementById("bottomNav").addEventListener("click", e => {
  const btn = e.target.closest("[data-nav]");
  if (!btn) return;
  let nav = btn.getAttribute("data-nav");
  if (nav === "self") nav = "member";
  store.view = nav;
  render();
});
document.getElementById("modalClose").onclick = closeResultModal;
const mcb = document.getElementById("modalCloseBtn"); if (mcb) mcb.onclick = closeResultModal;
document.getElementById("resultModal").addEventListener("click", e => {
  if (e.target.id === "resultModal") closeResultModal();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeResultModal();
});

(function boot() {
  const iconEl = document.getElementById("appIcon");
  if (iconEl) iconEl.src = "/icons/icon-192.png";
  render();
})();
</script>
